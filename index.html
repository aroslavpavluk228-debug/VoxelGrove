<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BlockCraft Web</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b9e8;font-family:Arial;touch-action:none}canvas{display:block}#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;color:white;background:#0007;padding:10px;border-radius:9px;pointer-events:none}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-size:26px;text-shadow:0 1px 4px #000;pointer-events:none}#bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#111a;padding:5px;border-radius:8px}.slot{width:43px;height:44px;border:2px solid #888;background:#333b;color:white;font-size:9px;display:grid;place-items:center}.slot b{width:19px;height:19px;border:1px solid #fff8}.slot.active{border:3px solid white}#help{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#0008;color:white;padding:6px 9px;border-radius:7px;font-size:11px;white-space:nowrap}#mobile{display:none;position:fixed;inset:0;pointer-events:none}.pad{position:absolute;bottom:80px;left:10px;pointer-events:auto}.pad button,.act button{height:43px;min-width:43px;margin:2px;border:1px solid #fff9;border-radius:9px;background:#182b40bb;color:white;font-weight:bold;touch-action:none}.pad>button{margin-left:48px}.act{position:absolute;right:8px;bottom:80px;display:flex;flex-direction:column;pointer-events:auto}.act button{font-size:10px;padding:0 8px}#toast{position:fixed;top:105px;left:50%;transform:translateX(-50%);color:white;background:#111c;padding:8px;border-radius:7px;opacity:0}@media(max-width:700px),(pointer:coarse){#mobile{display:block}#help{display:none}}
</style></head><body><div id="top"><b>BLOCKCRAFT WEB</b><span>Блоки: <span id="count">0</span></span></div><div id="cross">+</div><div id="help">WASD · миша · Space · ЛКМ зламати · ПКМ поставити · P зберегти</div><div id="bar"></div><div id="mobile"><div class="pad"><button data-m="f">▲</button><div><button data-m="l">◀</button><button data-m="b">▼</button><button data-m="r">▶</button></div></div><div class="act"><button id="jump">СТРИБОК</button><button id="break">ЗЛАМАТИ</button><button id="place">ПОСТАВИТИ</button></div></div><div id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87b9e8);scene.fog=new THREE.Fog(0x87b9e8,20,60);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100),renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x66734a,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-12,25,10);scene.add(sun);
const types={grass:0x65ad45,dirt:0x8b5a35,stone:0x858b91,sand:0xd9c58b,wood:0x936438},names=Object.keys(types),mats={};for(const n in types)mats[n]=new THREE.MeshLambertMaterial({color:types[n]});
const geo=new THREE.BoxGeometry(1,1,1),world=new Map(),k=(x,y,z)=>x+','+y+','+z;
function add(x,y,z,t='grass'){const id=k(x,y,z);if(world.has(id))return;const o=new THREE.Mesh(geo,mats[t]);o.position.set(x,y,z);o.userData={x,y,z,t};scene.add(o);world.set(id,o)}
function del(o){const d=o.userData;world.delete(k(d.x,d.y,d.z));scene.remove(o)}
function h(x,z){return Math.floor(1.5+Math.sin(x*.38)*.8+Math.cos(z*.31)*.7+Math.sin((x+z)*.2)*.5)}
for(let x=-14;x<=14;x++)for(let z=-14;z<=14;z++){let y=h(x,z);for(let q=-2;q<=y;q++)add(x,q,z,q===y?'grass':q<y-2?'stone':'dirt')}
for(let i=0;i<12;i++){let x=Math.floor(Math.random()*20-10),z=Math.floor(Math.random()*20-10);if(Math.abs(x)+Math.abs(z)>5){add(x,h(x,z)+1,z,'wood');add(x,h(x,z)+2,z,'wood')}}
const p={x:0,y:7,z:7,yaw:0,pitch:0,vy:0,ground:false},down={},held={f:false,b:false,l:false,r:false};let sel=0,locked=false,touch=null;
function eye(){camera.position.set(p.x,p.y+1.55,p.z);camera.rotation.order='YXZ';camera.rotation.y=p.yaw;camera.rotation.x=p.pitch}
function hit(){eye();const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);return ray.intersectObjects([...world.values()]).find(v=>v.distance<6)}
function mine(){let v=hit();if(v)del(v.object)}
function build(){let v=hit();if(!v)return;let q=v.object.position.clone().add(v.face.normal),x=Math.round(q.x),y=Math.round(q.y),z=Math.round(q.z);if(Math.hypot(x-p.x,y-p.y-1,z-p.z)>1.3)add(x,y,z,names[sel])}
function say(s){let t=document.querySelector('#toast');t.textContent=s;t.style.opacity=1;clearTimeout(t.tm);t.tm=setTimeout(()=>t.style.opacity=0,1300)}
function bar(){let b=document.querySelector('#bar');b.innerHTML='';names.forEach((n,i)=>{let e=document.createElement('div');e.className='slot'+(i===sel?' active':'');e.innerHTML='<b style="background:#'+types[n].toString(16).padStart(6,'0')+'"></b>'+n.toUpperCase();e.onclick=()=>{sel=i;bar()};b.append(e)})}bar();
function save(){localStorage.setItem('blockcraft-world',JSON.stringify([...world.values()].map(o=>o.userData)));say('Світ збережено')}
function load(){let a=localStorage.getItem('blockcraft-world');if(!a)return say('Немає збереження');for(let o of world.values())scene.remove(o);world.clear();JSON.parse(a).forEach(d=>add(d.x,d.y,d.z,d.t));say('Світ завантажено')}
addEventListener('keydown',e=>{down[e.code]=true;if(e.code.startsWith('Digit')){sel=+e.code.slice(5)-1;if(sel>=0&&sel<5)bar()}if(e.code==='KeyP')save();if(e.code==='KeyL')load();});addEventListener('keyup',e=>down[e.code]=false);
renderer.domElement.onclick=()=>{if(matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()};document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);document.addEventListener('mousemove',e=>{if(locked){p.yaw-=e.movementX*.002;p.pitch=Math.max(-1.45,Math.min(1.45,p.pitch-e.movementY*.002))}});
renderer.domElement.oncontextmenu=e=>e.preventDefault();renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0)mine();if(e.button===2)build()});
document.querySelectorAll('[data-m]').forEach(b=>{let n=b.dataset.m,fn=v=>e=>{e.preventDefault();held[n]=v};b.addEventListener('pointerdown',fn(true));['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,fn(false)))});
document.querySelector('#jump').onpointerdown=e=>{e.preventDefault();if(p.ground){p.vy=7;p.ground=false}};document.querySelector('#break').onpointerdown=e=>{e.preventDefault();mine()};document.querySelector('#place').onpointerdown=e=>{e.preventDefault();build()};
renderer.domElement.addEventListener('touchstart',e=>{for(let t of e.changedTouches)if(t.clientX>innerWidth*.48){touch={id:t.identifier,x:t.clientX,y:t.clientY};break}},{passive:false});renderer.domElement.addEventListener('touchmove',e=>{for(let t of e.changedTouches)if(touch&&t.identifier===touch.id){p.yaw-=(t.clientX-touch.x)*.006;p.pitch=Math.max(-1.4,Math.min(1.4,p.pitch-(t.clientY-touch.y)*.006));touch.x=t.clientX;touch.y=t.clientY;e.preventDefault()}},{passive:false});renderer.domElement.addEventListener('touchend',e=>{for(let t of e.changedTouches)if(touch&&t.identifier===touch.id)touch=null});
const clock=new THREE.Clock();function solid(x,y,z){return world.has(k(Math.round(x),Math.round(y),Math.round(z)))}
function tick(){requestAnimationFrame(tick);let dt=Math.min(clock.getDelta(),.04),f=new THREE.Vector3(-Math.sin(p.yaw),0,-Math.cos(p.yaw)),r=new THREE.Vector3(-f.z,0,f.x),m=new THREE.Vector3();if(down.KeyW||held.f)m.add(f);if(down.KeyS||held.b)m.sub(f);if(down.KeyA||held.l)m.sub(r);if(down.KeyD||held.r)m.add(r);if(m.lengthSq())m.normalize().multiplyScalar(5*dt);let nx=p.x+m.x,nz=p.z+m.z;if(!solid(nx,p.y,nz)&&!solid(nx,p.y+1,nz)){p.x=nx;p.z=nz}p.vy-=18*dt;let ny=p.y+p.vy*dt;if(p.vy<=0&&solid(p.x,ny-.12,p.z)){ny=Math.floor(ny-.12)+1;p.vy=0;p.ground=true}else p.ground=false;if(ny< -5){ny=8;p.x=0;p.z=7;p.vy=0}p.y=ny;eye();renderer.render(scene,camera);document.querySelector('#count').textContent=world.size}tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
