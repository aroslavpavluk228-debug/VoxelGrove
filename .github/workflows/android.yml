name: Build Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager is not installed on this runner"
            exit 1
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Test voxel engine
        run: |
          mkdir -p test-out
          javac -d test-out app/src/main/java/ua/waserko/voxelgrove/World.java tests/WorldTest.java
          java -cp test-out ua.waserko.voxelgrove.WorldTest
      - name: Build debug APK and release bundle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Upload Android app files
        uses: actions/upload-artifact@v4
        with:
          name: VoxelGrove-Android
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
